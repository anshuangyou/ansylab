# Gradle Daemon JVM criteria (Gradle 8.13 + AGP 8.13).
# Gradle 8.13 supports Java 8–23; Android Studio's bundled JBR here is Java 25,
# so pin the daemon to the local JDK 17 that AGP 8.13 is tested against.
# The foojay auto-provisioning URLs are intentionally omitted: a local JDK 17
# is expected to exist, so no download should happen.
toolchainVersion=17
toolchainVendor=ORACLE
